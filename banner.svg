<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Risky Iman Lael Prasetio, Web Developer dan Data Enthusiast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="14" fill="url(#grid)"/>

  <!-- ornamen cincin di sisi kanan -->
  <g fill="none" stroke="#C9A227" transform="translate(1010 130)">
    <circle r="40" stroke-opacity="0.55" stroke-width="2"/>
    <circle r="72" stroke-opacity="0.30" stroke-width="2"/>
    <circle r="104" stroke-opacity="0.16" stroke-width="2"/>
    <circle r="136" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M 0 -40 A 40 40 0 0 1 40 0" stroke-opacity="1" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- garis aksen emas -->
  <rect x="64" y="62" width="48" height="4" rx="2" fill="#C9A227"/>

  <text x="64" y="102" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3" fill="#C9A227">WEB DEVELOPER · DATA ENTHUSIAST</text>
  <text x="64" y="162" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF">Risky Iman Lael Prasetio</text>
  <text x="64" y="204" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9CA3AF">Membangun aplikasi web yang rapi dan eksperimen data yang terukur.</text>
</svg>
